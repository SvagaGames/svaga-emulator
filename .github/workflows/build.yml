name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      # Same permanent Svaga key as Svaga Archive (repository secrets SVAGA_*), so builds install over each other.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SVAGA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SVAGA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SVAGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SVAGA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets SVAGA_* are not set: the APK is signed with a temporary key and will not install over other builds."
            exit 0
          fi
          DIR="$RUNNER_TEMP/svaga-keys"
          mkdir -p "$DIR"
          echo "$KEYSTORE_B64" | base64 -d > "$DIR/svaga.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$DIR/svaga.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$DIR/keystore.properties"
          echo "SVAGA_KEYS=$DIR" >> "$GITHUB_ENV"
      # libretro cores (arm64) from the libretro buildbot, cached between builds
      - uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cores-${{ hashFiles('fetch-cores.sh') }}
      - run: bash fetch-cores.sh
      - run: gradle assembleRelease --no-daemon --console=plain
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SvagaEmulator.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: svaga-emulator
          path: out/*
      # https://github.com/SvagaGames/svaga-emulator/releases/latest/download/SvagaEmulator.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v$VERSION"
          NOTES="Сборка ${GITHUB_SHA::7}"
          [ -f CHANGELOG.md ] && NOTES="$(awk '/^## /{n++} n==1' CHANGELOG.md)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --title "Svaga Emulator $VERSION" --notes "$NOTES" --latest
